[project]
name = "chile-open-data-sdk"
version = "0.2.0"
description = "An unofficial, typed Python SDK for Chile's datos.gob.cl and CKAN Action API"
authors = [
    {name = "Eli-ezer Reuven Ramirez Ruiz",email = "ramirez.ruiz.eliezer.reuven@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["chile", "open-data", "ckan", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.0,<3",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/ezer-mackenzie/chile-open-data-sdk"
Issues = "https://github.com/ezer-mackenzie/chile-open-data-sdk/issues"

[tool.uv.build-backend]
module-name = "chile_open_data_sdk"
source-include = ["AGENTS.md", "CLAUDE.md", "docs/**", "tests/**", "examples/**", "scripts/**", "benchmarks/**", "pyrightconfig.json", ".pre-commit-config.yaml", "mkdocs.yml", "uv.lock", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "LOG", "PIE", "RUF", "S", "T10"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use assertions and synthetic credentials.
"tests/**" = ["S101", "S105", "S106"]
"benchmarks/**" = ["S101", "S105", "S106"]
"scripts/check_artifacts.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=chile_open_data_sdk --cov-report=term-missing --cov-fail-under=90"
markers = ["integration: opt-in read-only tests against the public portal"]

[tool.coverage.run]
branch = true
source = ["chile_open_data_sdk"]

[dependency-groups]
benchcore = [
    "benchcore[pytest]>=1.0.0,<2",
]
benchmark = [
    "pytest-benchmark>=5.3.0",
]
dev = [
    "basedpyright>=1.40.1",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv.dependency-groups]
benchcore = { requires-python = ">=3.12" }
