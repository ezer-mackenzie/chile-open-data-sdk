name: BenchCore reports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked --group benchcore
      - run: uv run --locked --group benchcore pytest benchmarks/benchcore_cases.py --no-cov --benchcore-save=.benchcore
      - uses: actions/upload-artifact@v4
        with:
          name: benchcore-reports
          path: .benchcore/
          include-hidden-files: true
          if-no-files-found: error
